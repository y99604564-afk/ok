<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة نتائج الطلاب</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/main.js" defer></script>
</head>

<body>

    <div class="container">

        <!-- عنوان النظام -->
        <h1 class="main-title">نظام إدارة نتائج الطلاب</h1>

        <!-- إضافة طالب جديد -->
        <section class="box">

            <h2>إضافة طالب جديد</h2>

            <div class="form-group">
                <label for="studentName">اسم الطالب</label>
                <input type="text" id="studentName"
                    placeholder="أدخل اسم الطالب">
            </div>

            <div class="form-group">
                <label for="grade1">درجة المادة الأولى</label>
                <input type="number" id="grade1"
                    min="0" max="100">
            </div>

            <div class="form-group">
                <label for="grade2">درجة المادة الثانية</label>
                <input type="number" id="grade2"
                    min="0" max="100">
            </div>

            <div class="form-group">
                <label for="grade3">درجة المادة الثالثة</label>
                <input type="number" id="grade3"
                    min="0" max="100">
            </div>

            <div class="form-group">
                <label for="attendance">نسبة الحضور</label>
                <input type="number" id="attendance"
                    min="0" max="100">
            </div>

            <!-- رسالة الخطأ -->
            <div id="errorBox"></div>

            <!-- زر إضافة طالب -->
            <button id="addStudent" class="add-btn">
                إضافة طالب
            </button>

            <!-- زر لجنة الرأفة -->
            <button id="mercyCommittee" class="mercy-btn">
                تفعيل لجنة الرأفة
            </button>

        </section>

        <!-- قائمة الطلاب -->
        <section class="box">

            <h2>قائمة الطلاب المضافين</h2>

            <div id="studentsDisplay">
                لا يوجد طلاب مضافون
            </div>

        </section>

        <!-- التقرير النهائي -->
        <section class="box">

            <h2>التقرير النهائي للجنة الرأفة</h2>

            <div id="reportDisplay"></div>

        </section>

    </div>

</body>
</html>
